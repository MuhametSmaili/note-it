name: CI
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  pre-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Use NodeJS
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run typecheck
      - run: npm run test
        env:
          CI: true

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Build and smoke-test extension
        run: npm run test:extension
